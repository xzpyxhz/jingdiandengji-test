.score-card{text-align:center;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 20px;margin-bottom:17px}.score{font-size:48px;line-height:1;font-weight:850;color:var(--primary)}.score-label{color:var(--muted);margin-top:8px}.result-summary{margin-top:14px;color:var(--muted);font-size:13px}.filters{display:flex;gap:9px;justify-content:center;margin:16px 0;flex-wrap:wrap}.filter{border:0;border-radius:20px;padding:8px 16px;background:#e9ecf3;color:var(--muted);font-weight:700;cursor:pointer}.filter.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(67,97,238,.24)}.record{background:#fff;border-radius:var(--radius);box-shadow:0 3px 12px rgba(43,45,66,.045);padding:18px;margin-bottom:12px;border-left:5px solid var(--line)}.record.correct{border-left-color:var(--success)}.record.wrong{border-left-color:var(--error)}.record-title{font-weight:750;line-height:1.5}.record.correct .record-title{color:var(--success)}.record.wrong .record-title{color:var(--error)}.record-meta{font-size:12px;color:var(--muted);margin-bottom:5px}.answer-box{margin-top:11px;background:#f8f9fc;border-radius:9px;padding:10px 12px;font-size:13px}.answer-row{margin:5px 0}.answer-row em{font-style:normal;color:var(--muted);font-size:12px}.answer-good{color:var(--success);font-weight:700}.answer-bad{color:var(--error);font-weight:700}.empty{text-align:center;color:var(--muted);padding:28px}.footer{text-align:center;color:#a2a8b7;font-size:12px;margin-top:20px}@media(max-width:600px){.app{padding:14px 12px 34px}.hero{padding:24px 6px 18px}.hero h1{font-size:24px}.panel{padding:17px}.check-grid{grid-template-columns:1fr}.mode-card{padding:13px}.question-card{padding:18px}.question{font-size:17px}.topbar{padding:11px 12px}.chapter-tag{max-width:38vw}.actions .btn{width:100%}.actions{flex-direction:column}.score{font-size:42px}}

一、黄帝内经篇

〔一〕单选题（A1 型＋A2 型,共 150 题）

1. 《素问·阴阳应象大论》中“飧泄”的含义是
A. 下利完谷不化
B.大便黏腻
C.暴泻如注
D. 下利不爽
E. 腹泻如水
【答案】A

2. 《素问·阴阳应象大论》云：“壮火之气衰，少火之气壮。”注“壮火”“少火”为药物气味厚薄者是
A. 张介宾
B. 王冰
C. 张志聪
D. 马莳
E.吴崑
【答案】D

3. 《素问·阴阳应象大论》“清阳发腠理，浊阴走五脏”的“浊阴”是指
A. 粪便
B. 尿液
C. 精血津液
D. 水谷精微
E. 痰饮等病理产物
【答案】C

4. 《素问·阴阳应象大论》“清阳出上窍，浊阴出下窍”的“浊阴”是指
A. 粪便和尿液
B. 水道中的阴液
C. 精血津液
D. 水谷精微
E. 痰饮等病理产物
【答案】A

5. 《素问·阴阳应象大论》“清阳实四肢，浊阴归六腑”的“浊阴”是指
A. 废渣和废水
B.水道中的阴液
C. 精血津液
D. 水谷精微
E. 痰饮等病理产物
【答案】A

6. 《素问·阴阳应象大论》“清阳出上窍，浊阴出下窍”的“清阳”是指
A. 阳气
B. 阴气
C. 卫阳之气
D. 浓厚的营养物质
E. 肺宣发的水谷精微
【答案】E

7. 《灵枢·本神》论五脏虚实之症，其中“悲”为
A. 心气虚
B. 肝气虚
C. 肺气虚
D. 脾气虚
E. 肾气虚
【答案】A

8. 《灵枢·本神》论五脏虚实之症，其中“腹胀，经溲不利”为
A. 脾气虚
B. 脾气实
C. 肝气实
D. 肾气虚
E. 肾气实
【答案】B

9. 《素问·阴阳应象大论》“飧泄”的病机是
A. 胃阳衰不能腐熟水谷
B. 心阳衰不能振奋
C. 清阳衰于下不能升
D. 肾阳衰不能温运脾土
E. 脾胃功能不协调
【答案】C

10. 《素问·阴阳应象大论》“膜胀”的病机是
A. 肺气不降
B. 肺气不宣
C. 中气不足不能升清
D. 浊阴滞于上而不能降
E. 肝脾功能不协调
【答案】D

11. 《灵枢·决气》述“六气”为病中，“耳聋”为
A. 液脱
B. 气脱
C. 血脱
D. 髓脱
E. 精脱
【答案】E

12. 《灵枢·决气》述“六气”为病中,“耳数鸣”为
A. 液脱
B. 气脱
C. 血脱
D. 津脱
E. 精脱
【答案】A

13. 《素问·生气通天论》“阴者藏精而起亟也，阳者卫外而为固也”主要说明
A. 阴阳对立制约
B. 阴阳互根互用
C. 阴阳互为消长
D. 阴阳转化
E. 阴阳平衡协调
【答案】B

14. 据《素问·生气通天论》，煎厥的主要病机是
A. 阴虚阳亢
B. 气血上逆
C. 肝风内动
D. 痰蒙心窍
E. 热扰心神
【答案】A

15. 据《素问·生气通天论》，薄厥的主要病机是
A. 阴虚阳亢
B. 气血上逆
C. 肝风内动
D. 痰蒙心窍
E. 热扰心神
【答案】B

16. 根据《素问·生气通天论》论述，导致“大筋緛短，小筋弛长”的原因是
A. 营卫不从
B. 寒气从之
C. 湿热不攘
D. 魄汗未尽
E. 外壅肌肉
【答案】C

17. 《素问·生气通天论》指出，导致“首如裹”的原因是
A. 气
B. 暑
C. 湿
D. 风
E. 寒
【答案】C

18. 《素问·生气通天论》说“汗，烦则喘喝，静而多言”是因于
A. 湿邪困表
B. 暑热熏蒸
C.寒邪束表
D. 风邪袭表
E. 湿邪蕴蒸
【答案】B

19. 据《素问·上古天真论》所述，在人体生长发育过程中起决定作用的是
A.水谷精微
B. 肾气
C.五脏精气
D. 肝血
E. 三焦气化
【答案】B

20. “天癸”成熟与衰竭的决定因素是
A. 任脉通，太冲脉盛与否
B. 肾气的盛衰
C.五脏六腑之气的盛衰
D. 肝气的盛衰
E. 心气的盛衰
【答案】B

21. 《素问·上古天真论》“天癸”的含义是
A. 肾精
B. 妇女按时而至的月经
C. 男之精，女之血
D. 水谷精微所化生
E. 藏于肾中，促进生殖功能成熟的物质
【答案】E

22. 《素问·上古天真论》“恬谈虚无”是指
A. 去世离俗
B. 无所作为
C.安闲清静，排除杂念
D. 饮食清淡
E. 起居安适
【答案】C

23. 《素问·上古天真论》“肾气平均，筋骨劲强，故真牙生而长极”见于
A. 女子三七
B. 男子三八
C. 男子四八
D. 女子四七
E. 男子五八
【答案】B

24. “圣人不治已病治未病”出自
A.《素问·阴阳应象大论》
B. 《素问·汤液醪醴论》
C.《素问·调经论》
D. 《素问·热论》
E.《素问·四气调神大论》
【答案】E

25. 《素问·四气调神大论》“春夏养阳，秋冬养阴”的本义指
A. 春夏顺其生长之气养生养长，秋冬顺其收藏之气养收养藏
B.阳为阴之根，阴为阳之基
C. 春夏食寒凉以制其亢阳，秋冬食温热以抑其盛阴
D. 春夏养其内虚之阳，秋冬养其内虚之阴
E. 春夏养心肝阳气，秋冬养肺肾阴气
【答案】A

26. 据《素问·上古天真论》,“女子二七”的发育标志为
A. 任脉通
B. 太冲脉盛
C. 月事以时下
D. 真牙生而长极
E.筋骨坚发长极
【答案】C

27. 据《素问·上古天真论》，“丈夫二八”的发育标志是
A. 精气溢泻
B. 天癸至
C. 真牙生而长极
D. 身体盛壮
E. 发长齿更
【答案】A

28. 下列为《内经》衰老征象的描述内容，但除外
A. 头面部征象
B. 躯体形态征象
C. 生理功能变化征象
D. 生殖功能变化征象
E. 自然界影响征象
【答案】E

29. 《素问·灵兰秘典论》称为“传导之官”的是
A. 小肠
B. 三焦
C. 膀胱
D. 胆
E. 大肠
【答案】E

30. 《素问·灵兰秘典论》称为“受盛之官”的脏腑是
A. 大肠
B. 胃
C. 小肠
D. 脾
E. 三焦
【答案】C

31. 《素问·灵兰秘典论》指出，心的生理功能是
A. 五脏六腑之大主
B. 君主之官，神明出焉
C. 心主神志
D. 生之本，神之变也
E. 主身之血脉
【答案】B

32. 《素问·灵兰秘典论》称为“相傅之官”的脏腑是
A. 心
B. 肝
C. 肺
D. 脾
E. 胆
【答案】C

【答案】ABD

◆ 其他（《温疫论》《广温疫论》《三时伏气外感篇》《外感温病篇》等）

〔一〕单选题（共 13 题）

1. ____为病，春月与冬季居多，或恶风，或不恶风，必身热、咳嗽、烦渴，此风温之证提纲也。
A. 风温
B. 春温
C. 暑温
D. 湿温
E. 伏暑
【答案】A

2. 夫____之为病，非风、非寒、非暑、非湿，乃天地间别有一种异气所感，其传有九，此治疫紧要关节。
A. 温毒
B. 春温
C. 温疫
D. 湿温
E. 伏暑
【答案】C

3. 凡人____之气，通乎天气，本气充满，邪不易入，本气适逢亏欠，呼吸之间，外邪因而乘之。
A. 口
B. 鼻
C. 皮毛
D. 口鼻
E. 肺
【答案】D

4. ____初起，先憎寒而后发热，日后但热而无憎寒也。
A. 温疫
B. 温毒
C. 温病
D. 温邪
E. 肺病
【答案】A

5. ____初得之二三日，其脉不浮不沉而数，昼夜发热，日晡益甚，头疼身痛。
A. 温疫
B. 温毒
C. 温病
D. 温邪
E. 肺病
【答案】A

6. 大凡______贵乎早逐，乘人气血未乱，肌肉未消，津液未耗，病人不至危殆，投剂不至掣肘，愈后亦易平复。
A. 温邪
B. 温毒
C. 外邪
D. 客邪
E. 风邪
【答案】D

7. 夫疫之传有____，然亦不出乎表里之间而已矣。
A. 三
B. 五
C. 七
D. 九
E. 六
【答案】D

8. ____下法与伤寒不同，伤寒下不厌迟，时疫下不厌早。
A. 时疫
B. 温病
C. 温热
D. 湿热
E. 风热
【答案】A

9. 伤寒在下其燥结，____在下其郁热。
A. 风热
B. 温病
C. 温热
D. 湿热
E. 时疫
【答案】E

10. 伤寒里证当下，必待表证全罢，______不论表邪罢与不罢，但兼里证即下。
A. 湿热
B. 温病
C. 温热
D. 时疫
E. 风热
【答案】D

11. 提出“春温一证，由冬令收藏未固，昔人以冬寒内伏，藏于少阴，入春发于少阳”，并对本病的理法方药作了较为系统论述的医家是
A. 叶天士
B. 俞根初
C. 杨栗山
D. 吴鞠通
E. 柳宝诒
【答案】A

12. 叶天士《三时伏气外感篇》指出春温的治疗，“昔贤以____为主方”。
A. 凉膈散
B. 黄芩汤
C. 银翘散
D. 增损双解散
E. 栀子豉汤
【答案】B

13. 患者，男，12月28日就诊。主诉：先憎寒后发热。近日疫病流行，患者先憎寒，后发热无憎寒，昼夜发热，日晡益甚，头疼身痛，舌绛苔白厚腻浊如齑粉，脉不浮不沉而数，治宜
A. 新加香薷饮
B. 达原饮
C. 藿香正气散
D. 一加减正气散
E. 二加减正气散
【答案】B

〔二〕多选题（共 8 题）

1.《外感温病篇》提出的风温症状有
A. 身热
B. 无汗
C. 咳嗽
D. 烦躁
E. 烦渴
【答案】ACE

2.《外感温病篇》提出关于风温的发病季节
A. 春
B. 夏
C. 长夏
D. 秋
E. 冬
【答案】AE

3.《温疫论》认为与温病的病因无关的是
A. 风
B. 燥
C. 寒
D. 暑
E. 湿
【答案】ACDE

4.《温疫论》记载关于温疫得之二三日的表现为
A. 脉不浮不沉而数
B. 昼夜发热
C. 申时热甚
D. 头疼
E. 身痛
【答案】ABCDE

5.《温疫论》记载时邪在伏脊之前，肠胃之后，其治法不可用
A. 麻黄
B. 桂枝
C. 大黄
D. 芒硝
E. 石膏
【答案】ABCDE

6.《广温疫论》记载时疫下法的使用原则
A. 时疫下不厌早
B. 时疫在下其郁热
C. 时疫但兼里证即下
D. 时疫表证
E. 时疫在肺卫
【答案】ABC

7. 时疫下法与伤寒不同之处体现在
A. 伤寒下不厌迟
B. 时疫下不厌早
C. 伤寒表证当下
D. 伤寒在下其燥结
E. 时疫在下其郁热
【答案】ABDE

8. 叶天士认为，春温初起的治疗宜
A. 直清里热
B. 顾护阴液
C. 辛温解表
D. 消食化滞
E. 和解少阳
【答案】AB
</script>
<script>
const CHAPTER_NAMES=['黄帝内经篇','伤寒论篇','金匮要略篇','温病学篇'];
let questions=[],mode='practice',quiz=[],index=0,records=[],feedbackShown=false,timerId=null,seconds=0,activeFilter='all';
function parseBank(text){const lines=text.replace(/\r/g,'').split('\n');let chapter='',type='',current=null,out=[];const push=()=>{if(current&&current.question&&Object.keys(current.options).length){current.question=current.question.trim();current.answer=(current.answer||'').replace(/[^A-E]/g,'').split('').sort().join('');out.push(current)}current=null};for(let raw of lines){const line=raw.trim();if(!line)continue;const cm=line.match(/^[一二三四]、(.+篇)/);if(cm){push();chapter=cm[1];type='';continue}if(line.includes('单选题')){push();type='单选题';continue}if(line.includes('多选题')){push();type='多选题';continue}const qm=line.match(/^\d+\.\s*(.*)$/);if(qm){push();current={chapter,type,number:line.match(/^\d+/)[0],question:qm[1],options:{},answer:''};continue}const am=line.match(/^【答案】\s*([A-E]+)/);if(am&&current){current.answer=am[1];continue}const om=line.match(/^([A-E])\s*[\.、．]\s*(.*)$/);if(om&&current){current.options[om[1]]=om[2].trim();continue}if(current&&!current.answer){current.question+=' '+line}}push();return out}
questions=parseBank(document.getElementById('source-data').textContent);const chapters=[...new Set(questions.map(q=>q.chapter))];
function init(){const wrap=document.getElementById('chapter-options');wrap.innerHTML=chapters.map((c,i)=>`<label class="check"><input type="checkbox" name="chapter" value="${esc(c)}" checked><span>${esc(c)} <small style="color:var(--muted);font-weight:400">${questions.filter(q=>q.chapter===c).length}题</small></span></label>`).join('');document.querySelectorAll('input[name=chapter]').forEach(e=>e.addEventListener('change',updateLimits));document.querySelectorAll('input[name=type]').forEach(e=>e.addEventListener('change',updateLimits));updateLimits()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMode(next){mode=next;document.querySelectorAll('.mode-card').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));document.getElementById('quantity-row').classList.toggle('hidden',next!=='test');document.getElementById('timer').classList.toggle('hidden',next!=='test');document.getElementById('start-label').textContent=next==='test'?'测试':'刷题';updateLimits()}
function selectedQuestions(){const cs=[...document.querySelectorAll('input[name=chapter]:checked')].map(e=>e.value);const ts=[...document.querySelectorAll('input[name=type]:checked')].map(e=>e.value);return questions.filter(q=>cs.includes(q.chapter)&&ts.includes(q.type))}
function updateLimits(){const n=selectedQuestions().length;const input=document.getElementById('quantity');input.max=Math.max(1,n);if(+input.value>n)input.value=n||1;document.querySelector('.quantity-row .hint').textContent=`最多可选当前范围内的题目数（${n}题）`}
function toggleAllChapters(){const boxes=[...document.querySelectorAll('input[name=chapter]')],all=boxes.every(e=>e.checked);boxes.forEach(e=>e.checked=!all);document.getElementById('toggle-chapters').textContent=all?'全选经典':'取消全选';updateLimits()}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function beginQuiz(){const pool=selectedQuestions(),err=document.getElementById('setup-error');if(!pool.length){err.textContent='请至少选择一个经典范围和一种题型。';return}let count=pool.length;if(mode==='test'){count=Math.min(Math.max(1,+document.getElementById('quantity').value||1),pool.length)}quiz=shuffle(pool).slice(0,count);index=0;records=new Array(quiz.length).fill(null);feedbackShown=false;err.textContent='';document.getElementById('mode-label').textContent=mode==='test'?'测试模式':'刷题模式';document.getElementById('quiz-note').textContent=mode==='test'?'选择的答案会显示为蓝色，提交后进入下一题':'选择的答案会显示为蓝色，点击“查看答案”后显示判定';if(mode==='test'){seconds=Math.max(60,count*60);startTimer()}else stopTimer();show('quiz-page');renderQuestion()}
function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function renderQuestion(){const q=quiz[index],rec=records[index],content=document.getElementById('question-content');feedbackShown=!!(rec&&rec.judged);document.getElementById('progress').textContent=`进度 ${index+1} / ${quiz.length}`;document.getElementById('prev-btn').disabled=index===0;document.getElementById('next-btn').textContent=mode==='practice'?(feedbackShown?(index===quiz.length-1?'完成':'下一题 →'):'查看答案'):(index===quiz.length-1?'提交并查看结果':'提交并下一题 →');content.innerHTML=`<div class="meta"><span class="tag">${q.type}</span><span class="chapter-tag">${esc(q.chapter)}</span></div><div class="question">${esc(q.question)}</div><div id="options">${Object.entries(q.options).map(([k,v])=>`<button class="option" data-key="${k}" onclick="choose('${k}')"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div>`;if(rec){rec.userKeys.forEach(k=>document.querySelector(`.option[data-key="${k}"]`)?.classList.add('selected'));if(rec.judged)applyJudgement(q,rec)}const fb=document.getElementById('feedback');if(feedbackShown){fb.className=`feedback ${rec.correct?'ok':'bad'}`;fb.innerHTML=`<strong>${rec.correct?'回答正确':'回答错误'}</strong>正确答案：${answerText(q,q.answer)}`;fb.classList.remove('hidden')}else{fb.className='feedback hidden';fb.innerHTML=''} }
function choose(key){if(feedbackShown)return;const q=quiz[index];if(q.type==='单选题')document.querySelectorAll('.option').forEach(e=>e.classList.remove('selected'));document.querySelector(`.option[data-key="${key}"]`).classList.toggle('selected')}
function currentKeys(){return [...document.querySelectorAll('.option.selected')].map(e=>e.dataset.key).sort()}
function judge(){const q=quiz[index],keys=currentKeys(),correct=keys.join('')===q.answer;records[index]={userKeys:keys,correct,judged:true};applyJudgement(q,records[index]);feedbackShown=true;const fb=document.getElementById('feedback');fb.className=`feedback ${correct?'ok':'bad'}`;fb.innerHTML=`<strong>${correct?'回答正确':'回答错误'}</strong>正确答案：${answerText(q,q.answer)}`;fb.classList.remove('hidden');document.getElementById('next-btn').textContent=index===quiz.length-1?(mode==='practice'?'完成':'提交并查看结果'):'下一题 →'}
function applyJudgement(q,rec){document.querySelectorAll('.option').forEach(el=>{const k=el.dataset.key;if(q.answer.includes(k))el.classList.add('correct');if(rec.userKeys.includes(k)&&!q.answer.includes(k))el.classList.add('wrong');el.disabled=true})}
function nextQuestion(){if(mode==='practice'&&!feedbackShown){judge();return}if(mode==='test'){const keys=currentKeys(),q=quiz[index];records[index]={userKeys:keys,correct:keys.join('')===q.answer,judged:true};if(index<quiz.length-1){index++;renderQuestion();return}finish()}else if(index<quiz.length-1){index++;renderQuestion()}else finish()}
function prevQuestion(){if(index===0)return;if(!feedbackShown){records[index]={userKeys:currentKeys(),correct:false,judged:false}}index--;renderQuestion()}
function answerText(q,keys){return keys.split('').map(k=>`${k}. ${esc(q.options[k]||'')}`).join('<br>')||'未作答'}
function finish(){stopTimer();const score=records.filter(r=>r&&r.correct).length;document.getElementById('score').textContent=`${score} / ${quiz.length}`;document.getElementById('result-summary').textContent=`正确率 ${quiz.length?Math.round(score/quiz.length*100):0}% · ${mode==='test'?'测试完成':'刷题完成'}`;renderRecords('all');show('result-page')}
function renderRecords(filter){activeFilter=filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const list=document.getElementById('records');list.innerHTML='';quiz.forEach((q,i)=>{const r=records[i]||{userKeys:[],correct:false};if(filter==='correct'&&!r.correct||filter==='wrong'&&r.correct)return;const el=document.createElement('article');el.className=`record ${r.correct?'correct':'wrong'}`;el.innerHTML=`<div class="record-meta">${q.type} · 第 ${i+1} 题 · ${esc(q.chapter)}</div><div class="record-title">${esc(q.question)}</div><div class="answer-box"><div class="answer-row"><em>你的作答：</em><span class="${r.correct?'answer-good':'answer-bad'}">${answerText(q,r.userKeys.join(''))}</span></div><div class="answer-row"><em>正确答案：</em><span class="answer-good">${answerText(q,q.answer)}</span></div></div>`;list.appendChild(el)});if(!list.children.length)list.innerHTML='<div class="empty">暂无符合条件的题目</div>'}
function backToSetup(){stopTimer();show('setup-page');window.scrollTo(0,0)}
function startTimer(){stopTimer();updateTimer();timerId=setInterval(()=>{seconds--;updateTimer();if(seconds<=0){alert('测试时间到，系统将自动交卷。');finish()}},1000)}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}function updateTimer(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
init();
</script>
</body>
